name: Build ShareX 14.1.0 Modified

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          if (Test-Path "ShareX.sln") {
              nuget restore ShareX.sln
          }
          elseif (Test-Path "ShareX.slnx") {
              dotnet restore ShareX.slnx
          }
          else {
              throw "ShareX solution file was not found."
          }

      - name: Build ShareX
        shell: pwsh
        run: |
          if (Test-Path "ShareX.sln") {
              msbuild ShareX.sln `
                /p:Configuration=Release `
                /p:Platform="Any CPU" `
                /m `
                /verbosity:minimal
          }
          elseif (Test-Path "ShareX.slnx") {
              msbuild ShareX.slnx `
                /p:Configuration=Release `
                /p:Platform="Any CPU" `
                /m `
                /verbosity:minimal
          }
          else {
              throw "ShareX solution file was not found."
          }

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching for ShareX.exe..."

          $exe = Get-ChildItem -Path . -Filter "ShareX.exe" -Recurse -File |
              Where-Object {
                  $_.FullName -match "\\bin\\Release\\"
              } |
              Select-Object -First 1

          if (-not $exe) {
              Write-Host "ShareX.exe was not found in bin\Release."

              Get-ChildItem -Path . -Filter "ShareX.exe" -Recurse -File |
                  Select-Object FullName

              throw "ShareX.exe was not found."
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

          "SHAREX_EXE=$($exe.FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exePath = $env:SHAREX_EXE

          if (-not (Test-Path $exePath)) {
              throw "ShareX.exe does not exist: $exePath"
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "ShareX-14.1.0-modified"

          if (Test-Path $outputDir) {
              Remove-Item $outputDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $outputDir | Out-Null

          $releaseDir = Split-Path $exePath -Parent

          Write-Host "Release directory:"
          Write-Host $releaseDir

          Copy-Item "$releaseDir\*" $outputDir -Recurse -Force

          Write-Host ""
          Write-Host "Artifact contents:"

          Get-ChildItem $outputDir -Recurse -File |
              Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-14.1.0-modified
          path: ShareX-14.1.0-modified
          if-no-files-found: error
          retention-days: 14
```
